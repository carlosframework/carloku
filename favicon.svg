<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 🤖 Carloku mark: a C drawn as a ring with its gap at three o'clock,
       and the wordmark's full-stop resting in the gap. -->
  <rect width="64" height="64" rx="14" fill="#5b3e96"/>
  <circle cx="30" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="88.8 18" stroke-dashoffset="-9"/>
  <circle cx="51" cy="44" r="5" fill="#c9b2f7"/>
</svg>
